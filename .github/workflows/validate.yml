name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate cant.yaml
        run: python3 scripts/validate.py
      - name: Schema is valid JSON
        run: python3 -c "import json; json.load(open('schema/cant-entry.schema.json'))"
